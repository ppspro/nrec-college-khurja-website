name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill in as much detail as possible so we can reproduce and fix it.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear, one-line description of the bug.
      placeholder: "e.g. Faculty page crashes when no faculty records exist"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe exactly how to trigger this bug.
      placeholder: |
        1. Navigate to /faculty
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (application crash / data loss)
        - High (major feature broken)
        - Medium (feature partially broken)
        - Low (cosmetic / minor)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Frontend – Public Website
        - Frontend – Admin CMS
        - Backend API
        - Database
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Production, Local Docker, Node 22, macOS 14"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any error messages, stack traces, or attach screenshots.
      render: shell
