services:
  mongodb:
    image: mongo:6.0
    container_name: nrec-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nrec-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nrec-backend-api
    restart: always
    ports:
      - "5001:5000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=${NODE_ENV}
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/nrec_college
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nrec-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nrec-frontend-app
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
      - NEXT_PUBLIC_UPLOADS_URL=http://localhost:5001
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => { if (r.statusCode < 400) process.exit(0); else process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nrec-network

volumes:
  mongo_data:
  uploads_data:

networks:
  nrec-network:
    driver: bridge
