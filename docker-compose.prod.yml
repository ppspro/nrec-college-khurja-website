services:
  mongodb:
    image: mongo:6.0
    container_name: nrec-mongodb-prod
    restart: unless-stopped
    volumes:
      - mongo_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - nrec-network-prod

  backend:
    image: nrec-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nrec-backend-prod
    restart: unless-stopped
    volumes:
      - uploads_data_prod:/app/uploads
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/nrec_college
      - PORT=5000
      - FRONTEND_URL=https://nreccollege.ac.in
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nrec-network-prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  frontend:
    image: nrec-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nrec-frontend-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://nreccollege.ac.in/api
      - NEXT_PUBLIC_UPLOADS_URL=https://nreccollege.ac.in
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nrec-network-prod
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

volumes:
  mongo_data_prod:
  uploads_data_prod:

networks:
  nrec-network-prod:
    driver: bridge
